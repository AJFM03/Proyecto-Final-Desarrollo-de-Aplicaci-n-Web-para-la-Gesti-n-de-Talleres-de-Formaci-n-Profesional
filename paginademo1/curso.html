<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalle del curso - Aprendiendo con el Mopri</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; margin: 20px; background:#f7f9fb; color:#111; }
    .container { max-width: 960px; margin: 24px auto; padding: 16px; }
    .card { background: linear-gradient(180deg,#2b2b3a,#252435); color:#fff; padding:20px; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,0.12); }
    img { width:100%; max-height:360px; object-fit:cover; border-radius:8px; display:block; }
    h1 { margin: 14px 0 6px; font-size:24px; }
    p.lead { margin: 8px 0 16px; color:#dfe7f3; }
    h3 { margin-top: 12px; }
    ul { margin-left: 18px; color:#eaf2ff; }
    .meta { display:flex; gap:12px; margin-top:10px; color:#cbdaf0; font-size:14px; }
    .btn { display:inline-block; margin-top:16px; padding:10px 14px; background:#3498db; color:#fff; text-decoration:none; border-radius:8px; }
    .error { background:#ffe6e6; color:#6b1212; padding:12px; border-radius:8px; }
    @media (max-width:600px) {
      .container { margin:12px; padding:8px; }
      h1 { font-size:20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="contenedor">
      <p>Cargando curso...</p>
    </div>
  </div>

  <script>
    // Cambia esto por la URL de tu API cuando despliegues!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
    const API_URL = 'http://localhost:3000';

    // Extrae query param
    function getParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    // Evitar inyección simple al insertar HTML
    function escapeHtml(str) {
      if (str === undefined || str === null) return '';
      return String(str).replace(/[&<>"'`=\/]/g, function(s) {
        return ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
          '/': '&#x2F;',
          '`': '&#x60;',
          '=': '&#x3D;'
        })[s];
      });
    }

    async function cargarDetalle() {
      const id = getParam('id');
      const cont = document.getElementById('contenedor');

      if (!id) {
        cont.innerHTML = '<div class="error">ID de curso no proporcionado.</div>';
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/cursos/${encodeURIComponent(id)}`);
        if (res.status === 404) {
          cont.innerHTML = '<div class="error">Curso no encontrado.</div>';
          return;
        }
        if (!res.ok) throw new Error('Error en la respuesta del servidor');

        const curso = await res.json();

        cont.innerHTML = `
          <div class="card" role="article" aria-labelledby="titulo-curso">
            <img src="${escapeHtml(curso.imagen)}" alt="${escapeHtml(curso.titulo)}">
            <h1 id="titulo-curso">${escapeHtml(curso.titulo)}</h1>
            <p class="lead">${escapeHtml(curso.descripcion)}</p>

            <div class="meta">
              ${curso.duracion ? `<span>Duración: ${escapeHtml(curso.duracion)}</span>` : ''}
              ${curso.nivel ? `<span>Nivel: ${escapeHtml(curso.nivel)}</span>` : ''}
            </div>

            <h3>Plan de estudio</h3>
            <ul>
              ${Array.isArray(curso.plan) ? curso.plan.map(item => `<li>${escapeHtml(item)}</li>`).join('') : '<li>No hay plan disponible.</li>'}
            </ul>

            ${curso.precio ? `<p style="margin-top:12px;color:#eaf2ff">Precio: <strong>${escapeHtml(String(curso.precio))}</strong></p>` : ''}

            <a class="btn" href="index.html">Volver a cursos</a>
          </div>
        `;
      } catch (err) {
        console.error(err);
        cont.innerHTML = '<div class="error">Error cargando el detalle del curso. Revisa la consola para más detalles.</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', cargarDetalle);
  </script>
</body>
</html>
