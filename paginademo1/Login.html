<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login Retro 8-Bit</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      background-image: url('Background_Sin_Robot.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;

      color: #fff;
      font-family: 'Press Start 2P', cursive;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background-color: #222;
      border: 4px solid #0ff;
      padding: 40px;
      text-align: center;
      box-shadow: 0 0 20px #0ff;
      width: 400px;
    }

    .login-box img {
      width: 80px;
      margin-bottom: 20px;
    }

    .login-box h1 {
      margin-bottom: 20px;
      color: #0ff;
      font-size: 26px;
      text-shadow: 2px 2px #000;
    }

    .login-box h2 {
      margin-bottom: 20px;
      font-size: 16px;
      text-shadow: 2px 2px #000;
    }

    .login-box h3 {
      margin-bottom: 20px;
      font-size: 12px;
      text-shadow: 2px 2px #000;
    }

    .login-box input {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 2px solid #0ff;
      background-color: #000;
      color: #0ff;
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
    }

    .login-box button {
      padding: 10px 20px;
      background-color: #0ff;
      color: #000;
      border: none;
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 2px 2px #000;
      margin-top: 10px;
    }

    .login-box button:hover {
      background-color: #fff;
      color: #0ff;
    }

    .login-box .options {
      margin-top: 20px;
      font-size: 10px;
    }

    .login-box .options a {
      color: #0ff;
      text-decoration: none;
      display: block;
      margin: 5px 0;
    }

    .login-box .options a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <!-- Título personalizado -->
    <h1>Academia de Cursos</h1>
    <h2>Aprendiendo con el Mopri</h2><br>
    <h3>Por favor ingrese su cuenta</h3>

    <!-- Campos de login -->
    <input type="text" id="usuario" placeholder="Usuario">
    <input type="password" id="contraseña" placeholder="Contraseña">
    <button onclick="login()">ENTRAR</button>

  <script>
    function login() {
      const usuario = document.getElementById('usuario').value;
      const contraseña = document.getElementById('contraseña').value;

      if (usuario && contraseña) {
        // Aquí puedes agregar validación real si tienes backend
        window.location.href = 'index.html'; // Cambia esto por la página a la que quieres redirigir
      } else {
        alert("Por favor completa todos los campos");
      }
    }
  </script>
</body>
</html>
